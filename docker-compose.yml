version: "3.8"

services:
  orca:
    platform: linux/amd64
    build: .
    image: jma-receipt-weborca:22.04
    depends_on:
      - db
    ports:
      - "8000:8000"
    environment:
      TZ: Asia/Tokyo
      ORCA_DB_HOST: db
      ORCA_DB_PORT: 5432
      ORCA_DB_NAME: orca
      ORCA_DB_USER: orca
      ORCA_DB_PASS: orca_password
      ORCA_DB_ENCODING: UTF-8
      ORCA_DB_WAIT_SECONDS: 300
      RUN_SCHEMA_CHECK: "false"
      ORMASTER_PASS: change_me
    volumes:
      - orca_state:/var/lib/orca
    restart: unless-stopped

  db:
    image: postgres:10
    environment:
      TZ: Asia/Tokyo
      POSTGRES_USER: orca
      POSTGRES_PASSWORD: orca_password
      POSTGRES_DB: orca
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orca"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  orca_state:
  pg_data:
